package:
  name: train-horn
  description: "Train horn calculators: SPL vs distance, air tank runtime and
    compressor recovery, and copper AWG by voltage drop. Port of
    trainhorn-calc."
  dependencies:
    - arrays: ">=7.3.1 <8.0.0"
    - either: ">=6.1.1 <7.0.0"
    - foldable-traversable: ">=6.0.1 <7.0.0"
    - integers: ">=6.0.2 <7.0.0"
    - maybe: ">=6.0.1 <7.0.0"
    - numbers: ">=9.0.2 <10.0.0"
    - prelude: ">=6.0.3 <7.0.0"
    - strings: ">=6.1.0 <7.0.0"
    - tuples: ">=7.0.1 <8.0.0"
  test:
    main: Test.Main
    dependencies:
      - console
      - effect
      - exceptions
  publish:
    version: 1.0.0
    license: MIT
    location:
      githubOwner: train-horn
      githubRepo: purescript-train-horn
workspace:
  packageSet:
    registry: 82.3.0
  extraPackages: {}
